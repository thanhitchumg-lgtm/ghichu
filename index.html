<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- Cấu hình App toàn màn hình trên iPhone -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Ghi Chú">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3233/3233483.png">
    
    <title>Ghi Chú & Việc Cần Làm</title>
    <style>
        :root {
            --bg-color: #F2F2F7;
            --card-bg: #FFFFFF;
            --primary: #007AFF;
            --success: #34C759;
            --danger: #FF3B30;
            --text-main: #000000;
            --text-sub: #8E8E93;
        }
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        }
        body {
            margin: 0;
            padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px;
            background-color: var(--bg-color);
            color: var(--text-main);
            user-select: none;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin: 20px 0 16px 0;
        }
        .form-card, .note-list, .backup-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            margin-bottom: 16px;
        }
        .input-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 6px;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #E5E5EA;
            border-radius: 10px;
            font-size: 16px;
            background: #FAFAFC;
            outline: none;
        }
        textarea {
            resize: none;
            height: 80px;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
        }
        .date-select-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }
        button.add-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 4px;
        }
        button.add-btn:active {
            opacity: 0.8;
        }
        .list-header {
            font-size: 18px;
            font-weight: 600;
            margin: 8px 0 10px 0;
        }
        .note-list {
            padding: 0;
            overflow: hidden;
        }
        .note-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 1px solid #E5E5EA;
            gap: 12px;
        }
        .note-item:last-child {
            border-bottom: none;
        }
        .note-left {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            flex: 1;
            overflow: hidden;
        }
        /* Ô tròn Checkbox tùy chỉnh */
        .custom-checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid var(--text-sub);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            margin-top: 1px;
            transition: all 0.2s;
        }
        .note-item.completed .custom-checkbox {
            background: var(--success);
            border-color: var(--success);
        }
        .custom-checkbox::after {
            content: '';
            width: 6px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
            display: none;
        }
        .note-item.completed .custom-checkbox::after {
            display: block;
        }
        .note-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }
        .note-date-badge {
            font-size: 11px;
            font-weight: 700;
            color: var(--primary);
            background: #E8F1FC;
            padding: 2px 6px;
            border-radius: 6px;
            width: fit-content;
        }
        .note-content {
            font-size: 15px;
            color: var(--text-main);
            word-break: break-word;
            line-height: 1.4;
            transition: color 0.2s;
        }
        /* Hiệu ứng gạch ngang khi hoàn thành */
        .note-item.completed .note-content {
            text-decoration: line-through;
            color: var(--text-sub);
        }
        .delete-btn {
            background: #FFE5E5;
            color: var(--danger);
            border: none;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .empty-text {
            text-align: center;
            padding: 24px;
            color: var(--text-sub);
            font-size: 15px;
        }
        .backup-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn-secondary {
            background: #E5E5EA;
            color: var(--text-main);
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Ghi Chú</h1>

    <!-- Form nhập liệu -->
    <div class="form-card">
        <div class="input-group">
            <label>Chọn Ngày / Tháng / Năm</label>
            <div class="date-select-row">
                <select id="selectDay"></select>
                <select id="selectMonth"></select>
                <select id="selectYear"></select>
            </div>
        </div>

        <div class="input-group">
            <label>Nội dung ghi chú</label>
            <textarea id="noteContent" placeholder="Nhập nội dung ghi chú..."></textarea>
        </div>

        <button class="add-btn" onclick="addNote()">+ Thêm Ghi Chú</button>
    </div>

    <!-- Danh sách hiển thị -->
    <div class="list-header">Danh sách ghi chú</div>
    <div class="note-list" id="noteListContainer"></div>

    <!-- Sao lưu & Khôi phục -->
    <div class="list-header" style="margin-top: 20px;">Sao lưu & Khôi phục</div>
    <div class="backup-card">
        <div class="backup-grid">
            <button class="btn-secondary" onclick="backupData()">⬇️ Sao lưu file</button>
            <button class="btn-secondary" onclick="document.getElementById('restoreInput').click()">⬆️ Khôi phục</button>
        </div>
        <input type="file" id="restoreInput" accept=".json" style="display:none" onchange="restoreData(event)">
    </div>

    <script>
        function initDateSelectors() {
            const daySelect = document.getElementById('selectDay');
            const monthSelect = document.getElementById('selectMonth');
            const yearSelect = document.getElementById('selectYear');

            const today = new Date();
            const currentDay = today.getDate();
            const currentMonth = today.getMonth() + 1;
            const currentYear = today.getFullYear();

            // Ngày (1 - 31)
            for (let d = 1; d <= 31; d++) {
                let opt = document.createElement('option');
                opt.value = d;
                opt.text = d;
                if (d === currentDay) opt.selected = true;
                daySelect.appendChild(opt);
            }

            // Tháng (1 - 12)
            for (let m = 1; m <= 12; m++) {
                let opt = document.createElement('option');
                opt.value = m;
                opt.text = m;
                if (m === currentMonth) opt.selected = true;
                monthSelect.appendChild(opt);
            }

            // Năm đầy đủ từ 2026 đến 2050
            for (let y = 2026; y <= 2050; y++) {
                let opt = document.createElement('option');
                opt.value = y;
                opt.text = y;
                if (y === currentYear) opt.selected = true;
                yearSelect.appendChild(opt);
            }
        }

        let notes = JSON.parse(localStorage.getItem('my_notes_v2')) || [];

        function renderNotes() {
            const container = document.getElementById('noteListContainer');

            if (notes.length === 0) {
                container.innerHTML = '<div class="empty-text">Chưa có ghi chú nào</div>';
                return;
            }

            container.innerHTML = notes.map((item, index) => `
                <div class="note-item ${item.completed ? 'completed' : ''}">
                    <div class="note-left">
                        <div class="custom-checkbox" onclick="toggleComplete(${index})"></div>
                        <div class="note-info">
                            <span class="note-date-badge">${item.day}/${item.month}/${item.year}</span>
                            <span class="note-content">${item.content}</span>
                        </div>
                    </div>
                    <button class="delete-btn" onclick="deleteNote(${index})">Xóa</button>
                </div>
            `).join('');
        }

        function addNote() {
            const day = document.getElementById('selectDay').value;
            const month = document.getElementById('selectMonth').value;
            const year = document.getElementById('selectYear').value;
            const contentInput = document.getElementById('noteContent');
            const content = contentInput.value.trim();

            if (!content) {
                alert('Vui lòng nhập nội dung ghi chú!');
                return;
            }

            notes.unshift({
                day: String(day).padStart(2, '0'),
                month: String(month).padStart(2, '0'),
                year: year,
                content: content,
                completed: false // Mặc định chưa hoàn thành
            });

            saveAndRender();
            contentInput.value = '';
        }

        // Đổi trạng thái hoàn thành khi bấm vào ô tròn
        function toggleComplete(index) {
            notes[index].completed = !notes[index].completed;
            saveAndRender();
        }

        function deleteNote(index) {
            if (confirm('Bạn có chắc muốn xóa ghi chú này?')) {
                notes.splice(index, 1);
                saveAndRender();
            }
        }

        function saveAndRender() {
            localStorage.setItem('my_notes_v2', JSON.stringify(notes));
            renderNotes();
        }

        function backupData() {
            if (notes.length === 0) return alert('Chưa có dữ liệu để sao lưu!');
            const dataStr = JSON.stringify(notes, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `sao-luu-ghi-chu-${new Date().toISOString().slice(0,10)}.json`;
            a.click();
        }

        function restoreData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        notes = imported;
                        saveAndRender();
                        alert('Khôi phục dữ liệu thành công!');
                    }
                } catch (err) {
                    alert('File sao lưu không hợp lệ!');
                }
            };
            reader.readAsText(file);
        }

        initDateSelectors();
        renderNotes();
    </script>
</body>
</html>
